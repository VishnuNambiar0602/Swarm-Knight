[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "swarm-knight"
version = "0.1.0"
description = "Multi-LLM collaboration via debate/refinement"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.scripts]
knight = "swarm.cli:app"
swarm-knight = "swarm.cli:app"

[tool.setuptools.packages.find]
include = ["swarm*"]
