[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "swarm-knight"
version = "2.2.0"
description = "Multi-LLM collaboration via debate/refinement with consensus engine, memory, and reputation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
knight = "swarm.cli:app"
swarm-knight = "swarm.cli:app"

[tool.setuptools.packages.find]
include = ["swarm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
